services:
  notifications-app:
    build: .
    volumes:
      - .:/app
    environment:
      DB_HOST: notification-mysql
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: pass
      DB_NAME: notification_db
      KAFKA_HOST: kafka:9092
      KAFKA_TOPIC: notifications
      KAFKA_GROUP_ID: notifications-group
      KAFKA_AUTO_OFFSET_RESET: earliest
      LOG_LEVEL: INFO
    ports:
      - "8006:8006"
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["python", "entrypoint.py"]
    networks:
      - brokerx-network

  mysql:
    image: mysql:8
    container_name: notification-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - notification_mysql_data:/var/lib/mysql
      - ./mysql-init/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - brokerx-network

volumes:
  notification_mysql_data:

networks:
  brokerx-network:
    external: true